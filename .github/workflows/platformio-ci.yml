name: PlatformIO CI

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        board:
          - { env: esp32dev, chip: esp32, boot_offset: "0x1000" }
          - { env: esp32-s3-devkitc-1, chip: esp32s3, boot_offset: "0x0" }

    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO Core
        run: pip install --upgrade platformio "esptool==4.8.1"

      - name: Build PlatformIO Project For ${{ matrix.board.env }}
        run: pio run -e ${{ matrix.board.env }}

      - name: Copy firmware.bin to root directory
        run: cp .pio/build/${{ matrix.board.env }}/firmware.bin firmware-ota.bin

      - name: Packing Firmware
        run: |
          esptool.py --chip ${{ matrix.board.chip }} merge_bin -o merged-flash.bin \
            --flash_mode dio --flash_size 4MB \
            ${{ matrix.board.boot_offset }} .pio/build/${{ matrix.board.env }}/bootloader.bin \
            0x8000 .pio/build/${{ matrix.board.env }}/partitions.bin \
            0x10000 .pio/build/${{ matrix.board.env }}/firmware.bin

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-mask-${{ matrix.board.env }}
          path: |
            merged-flash.bin
            firmware-ota.bin
